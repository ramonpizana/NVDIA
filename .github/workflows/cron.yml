name: RTX 5090 monitor

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send an SMTP test email without checking stores
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.19"

      - name: Test
        run: go test ./...

      - name: Check retailer integrations
        run: go run ./cmd
        env:
          DRY_RUN: "true"
          MAX_PRICE_MXN: "80000"

  notify:
    name: Search and notify
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.19"

      - name: Search and notify
        run: go run ./cmd
        env:
          SEND_TEST_EMAIL: ${{ inputs.send_test_email || false }}
          MAX_PRICE_MXN: ${{ vars.MAX_PRICE_MXN || '80000' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
